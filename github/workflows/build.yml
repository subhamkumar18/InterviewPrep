name: Build Interview AI Desktop

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # macOS
  # ==========================================

  build-macos:
    name: Build macOS ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run make

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Interview-AI-macOS
          path: out/make/**/*.zip
          if-no-files-found: error


  # ==========================================
  # Windows
  # ==========================================

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run make

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Interview-AI-Windows
          path: out/make/**/*.exe
          if-no-files-found: error


  # ==========================================
  # Ubuntu
  # ==========================================

  build-linux:
    name: Build Ubuntu DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build Ubuntu
        run: npm run make

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: Interview-AI-Ubuntu
          path: out/make/**/*.deb
          if-no-files-found: error