name: Build Interview AI Desktop

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # macOS
  # ==========================================

  build-macos:
    name: Build macOS ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean previous builds
        run: rm -rf out

      - name: Build macOS
        run: npm run make

      - name: Show build output
        run: find out -type f

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Interview-AI-macOS
          path: out/make/**/*.zip
          if-no-files-found: error


  # ==========================================
  # Windows
  # ==========================================

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean previous builds
        shell: pwsh
        run: |
          if (Test-Path out) {
            Remove-Item -Recurse -Force out
          }

      - name: Build Windows
        run: npm run make

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Path out -Recurse -File

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Interview-AI-Windows
          path: out/make/**/*.exe
          if-no-files-found: error


  # ==========================================
  # Ubuntu / Debian
  # ==========================================

  build-linux:
    name: Build Ubuntu DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            dpkg \
            dpkg-dev

      - name: Install dependencies
        run: npm ci

      - name: Clean previous builds
        run: rm -rf out

      - name: Build Ubuntu DEB
        run: npm run make

      - name: Show build output
        run: find out -type f

      - name: Upload Ubuntu DEB
        uses: actions/upload-artifact@v4
        with:
          name: Interview-AI-Ubuntu
          path: out/make/**/*.deb
          if-no-files-found: error
